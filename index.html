<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10241b"><title>100 / Push-ups</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1914;color:#f4f8f2;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:22px 20px 100px}h1{font-size:30px;margin:8px 0 20px}h2{font-size:20px}small,.muted{color:#a6b8ac}.card{background:#172b21;border:1px solid #355040;border-radius:22px;padding:20px;margin:14px 0}.hero{background:linear-gradient(130deg,#254d35,#173525)}.big{font-size:64px;font-weight:850;margin:8px 0}.accent{color:#a7f08d}button,input,select{font:inherit}button{background:#a7ef89;border:0;border-radius:13px;padding:13px 17px;font-weight:750;color:#102019;cursor:pointer}button.secondary{background:#294437;color:white}button:disabled{opacity:.5}input,select{background:#0e2118;color:white;border:1px solid #42604c;border-radius:10px;padding:12px;max-width:100%}nav{position:fixed;bottom:0;left:0;right:0;background:#10271b;display:flex;justify-content:center;border-top:1px solid #38513d}nav button{background:transparent;color:#d8e7d9;flex:1;max-width:170px;border-radius:0;padding:18px 4px}.active{color:#a7ef89} .hidden{display:none}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{padding:10px 0;border-radius:9px;text-align:center;background:#284032;color:#e2e9e2;font-size:13px}.done{background:#82d27b;color:#102019}.test{outline:2px solid #e9c37b}.today{box-shadow:inset 0 0 0 2px #fff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.row button{flex-shrink:0}label{display:block;margin:15px 0 7px}.pill{display:inline-block;padding:7px 12px;background:#2e4939;border-radius:20px;margin:4px 5px 4px 0}progress{width:100%;accent-color:#a7ef89;height:12px}p{line-height:1.5}</style></head><body><main><header><small>THE 100-DAY CHALLENGE</small><h1>100<span class="accent">/</span> Push-ups</h1></header><section id="today"></section><section id="calendar" class="hidden"></section><section id="settings" class="hidden"></section></main><nav><button id="tabtoday" onclick="tab('today')">● Today</button><button id="tabcalendar" onclick="tab('calendar')">▦ Calendar</button><button id="tabsettings" onclick="tab('settings')">⚙ Settings</button></nav><script>
const KEY='pushup100.v2',dateString=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),today=dateString(new Date()),initial={start:today,baseline:45,entries:{},time:'08:00'};let s;try{s={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s={...initial}};const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const dateAt=n=>{let d=new Date(s.start+'T12:00:00');d.setDate(d.getDate()+n-1);return dateString(d)},current=()=>Math.max(1,Math.min(100,Math.floor((new Date(today+'T12:00:00')-new Date(s.start+'T12:00:00'))/86400000)+1)),check=[1,30,60,80,100],goal=n=>Math.round(s.baseline+(100-s.baseline)*n/100),type=n=>check.includes(n)?'Checkpoint':n%7===0||n%7===4?'Recovery':n%7===1?'Performance':n%7===2||n%7===5?'Volume':'Easy',prescription=n=>{let t=type(n),g=goal(n);return t==='Checkpoint'?'Warm up, then perform one maximum-quality unbroken set. Record your result.':t==='Recovery'?'Rest from push-ups. Recovery supports progress.':t==='Performance'?'1 long controlled set, stop with 1–2 reps in reserve; then 2 easy sets of '+Math.round(g*.35)+'.':t==='Volume'?'4 sets of '+Math.max(15,Math.round(g*.55))+' reps. Rest 2 minutes between sets.':'3 comfortable sets of '+Math.max(12,Math.round(g*.33))+' reps. Keep 3+ reps in reserve.'};
function tab(id){for(let t of ['today','calendar','settings']){document.getElementById(t).classList.toggle('hidden',t!==id);document.getElementById('tab'+t).classList.toggle('active',t===id)}render()}
function complete(n){let key=dateAt(n);s.entries[key]={...s.entries[key],done:!s.entries[key]?.done};save();render()}
function logTest(n){let v=prompt('How many unbroken press-ups did you complete?',s.entries[dateAt(n)]?.max||'');if(v===null)return;let k=dateAt(n);s.entries[k]={...s.entries[k],max:Math.max(0,Number(v)||0),done:true};save();render()}
function render(){let n=current(),t=type(n),e=s.entries[dateAt(n)]||{},entries=Object.values(s.entries),done=entries.filter(x=>x.done).length,best=Math.max(s.baseline,...entries.map(x=>x.max||0)),total=entries.reduce((a,x)=>a+(x.reps||0),0);
document.getElementById('today').innerHTML='<div class="card hero"><small>TODAY · DAY '+n+' OF 100</small><div class="big">'+(t==='Checkpoint'?'TEST':t==='Recovery'?'REST':t.toUpperCase())+'</div><progress value="'+n+'" max="100"></progress><p>'+prescription(n)+'</p><div class="row"><button onclick="complete('+n+')">'+(e.done?'✓ Completed — undo':'✓ Complete today')+'</button>'+(t==='Checkpoint'?'<button class="secondary" onclick="logTest('+n+')">Record max</button>':'')+'</div></div><div class="card"><h2>How are you feeling?</h2><p>Choose an easier session if you feel flat. Pain or illness means rest, not catching up.</p><button class="secondary" onclick="alert(\'Easy option: 2–3 relaxed sets of 10–15, well short of failure.\')">Easy option</button> <button class="secondary" onclick="alert(\'Recovery option: skip press-ups and tick today complete.\')">Recovery option</button></div><div class="card"><h2>Your progress</h2><div class="row"><div><div class="big">'+done+'</div><small>Days completed</small></div><div><div class="big">'+best+'</div><small>Best unbroken</small></div></div><p class="muted">Next checkpoint: '+(check.find(x=>x>n)||100)+' · Target on day 100: 100 unbroken</p></div>';
document.getElementById('calendar').innerHTML='<div class="card"><h2>100-day calendar</h2><p class="muted">Green = complete · Gold outline = checkpoint</p><div class="grid">'+Array.from({length:100},(_,i)=>{let d=i+1,k=dateAt(d),v=s.entries[k];return '<div class="day '+(v?.done?'done ':'')+(check.includes(d)?'test ':'')+(d===n?'today':'')+'" title="'+k+' · '+type(d)+'" onclick="dayDetail('+d+')">'+d+'</div>'}).join('')+'</div></div><div class="card"><h2>Checkpoints</h2>'+check.map(d=>'<div class="row"><p>Day '+d+' · '+dateAt(d)+'<br><small>Target ~'+goal(d)+' reps · Actual '+(s.entries[dateAt(d)]?.max??'—')+'</small></p><button class="secondary" onclick="logTest('+d+')">Record</button></div>').join('')+'</div>';
document.getElementById('settings').innerHTML='<div class="card"><h2>Challenge settings</h2><label>Start date</label><input type="date" id="start" value="'+s.start+'"><label>Starting max unbroken</label><input type="number" id="base" min="1" max="99" value="'+s.baseline+'"><label>Reminder time</label><input type="time" id="time" value="'+s.time+'"><p><button onclick="saveSettings()">Save settings</button></p></div><div class="card"><h2>Daily reminders</h2><p>Export a calendar file with 100 daily reminders. Import it into your preferred calendar app.</p><button onclick="calendarFile()">Download reminders</button></div><div class="card"><h2>Backup</h2><button class="secondary" onclick="backup()">Export progress</button> <button class="secondary" onclick="document.getElementById(\'restore\').click()">Restore progress</button><input hidden type="file" id="restore" accept=".json" onchange="restoreFile(this)"><p class="muted">Progress is saved on this device/browser. It does not automatically sync across devices.</p></div>';
}
function dayDetail(n){let k=dateAt(n),e=s.entries[k]||{};if(check.includes(n)){logTest(n);return}if(confirm('Day '+n+' · '+k+'\n'+type(n)+'\n\n'+prescription(n)+'\n\nToggle completion?'))complete(n)}
function saveSettings(){s.start=document.getElementById('start').value||today;s.baseline=Math.max(1,Math.min(99,Number(document.getElementById('base').value)||45));s.time=document.getElementById('time').value||'08:00';save();render();alert('Settings saved')}
function download(name,content,mime){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function backup(){download('pushups-backup.json',JSON.stringify(s,null,2),'application/json')}
function restoreFile(el){let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.start||!v.entries)throw Error();s=v;save();render();alert('Progress restored')}catch{alert('Invalid backup file')}};if(el.files[0])r.readAsText(el.files[0])}
function calendarFile(){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//100 Pushups//Challenge//EN'];for(let n=1;n<=100;n++){let d=dateAt(n).replaceAll('-',''),time=s.time.replace(':','')+'00';lines.push('BEGIN:VEVENT','UID:pushups-'+n+'-'+d+'@challenge','DTSTART:'+d+'T'+time,'DURATION:PT10M','SUMMARY:Push-ups Day '+n+' - '+type(n),'DESCRIPTION:'+prescription(n),'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Time for your push-ups','END:VALARM','END:VEVENT')}lines.push('END:VCALENDAR');download('100-pushups-reminders.ics',lines.join('\r\n'),'text/calendar')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});tab('today');
</script></body></html>
